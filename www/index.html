<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Reminder App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- App Header -->
        <div class="app-header">
            <div class="header-content">
                <h1>Reminders</h1>
                <p id="current-date">Aaj ka Din</p>
            </div>
            <div class="app-badge">⚡ Live</div>
        </div>

        <!-- App Body -->
        <div class="app-body">
            <!-- Add Reminder Card -->
            <div class="glass-card input-section">
                <h2>Naya Reminder</h2>
                <div class="input-wrap">
                    <input type="text" id="taskName" placeholder="Jaise: 9 baje khana khana hai..." autocomplete="off">
                </div>
                
                <!-- Custom Time Picker Trigger Button -->
                <div class="time-picker-wrap">
                    <label>Samay Chunein:</label>
                    <div id="timeDisplayBtn" class="time-display-box" onclick="openTimePicker()">
                        <span id="selectedTimeString">09:00 AM</span>
                        <span class="clock-icon">🕒</span>
                    </div>
                </div>

                <button id="setBtn" onclick="addReminder()">Reminder Set Karein</button>
            </div>

            <!-- Active Reminders Section -->
            <div class="reminders-section">
                <h3>Aane Wale Reminders</h3>
                <div id="reminderList"></div>
            </div>
        </div>
    </div>

    <!-- Custom Clock Modal (Popup) -->
    <div id="clockModal" class="modal-overlay">
        <div class="clock-modal-content">
            <h3>Samay Set Karein</h3>
            
            <div class="time-selectors">
                <!-- Hours Column -->
                <div class="scroll-column" id="hourColumn">
                    <!-- JS se hours aayenge -->
                </div>
                <span class="time-colon">:</span>
                <!-- Minutes Column -->
                <div class="scroll-column" id="minuteColumn">
                    <!-- JS se minutes aayenge -->
                </div>
                <!-- AM/PM Column -->
                <div class="scroll-column ampm-col" id="ampmColumn">
                    <div class="time-option selected" onclick="setAmPm('AM')">AM</div>
                    <div class="time-option" onclick="setAmPm('PM')">PM</div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeTimePicker()">Radd Karein</button>
                <button class="modal-btn confirm" onclick="confirmTime()">Tay Karein</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
