name: Build Android APK from www folder

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: |
          # Capacitor ko bata rahe hain ki web files 'www' folder ke andar hain
          npx cap init "My Reminder App" "com.myname.reminderapp" --web-dir=www

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync

      - name: Generate App Icons from www/icon.png
        run: |
          npm install @capacitor/assets --save-dev
          # Agar icon www folder ke andar hai toh assets command wahi target karegi
          npx capacitor-assets generate --android --assetPath www

      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          echo "configurations.all { resolutionStrategy.eachDependency { DependencyResolveDetails details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } }" >> android/app/build.gradle

      - name: Give Android Internet & Notification Permissions
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/s/$/ android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Reminder-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
